name: Monitor ISO

on:
  # Co 4 godziny (czas UTC). GitHub potrafi opoznic start o kilka-kilkanascie minut.
  schedule:
    - cron: '0 */4 * * *'

  # Reczne uruchomienie z zakladki Actions
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tryb testowy - nie wysylaj nic na Discord'
        type: boolean
        default: false
      baseline:
        description: 'Zapisz stan bazowy od nowa (bez powiadomien)'
        type: boolean
        default: false
      force:
        description: 'Pobierz CSV nawet jesli sie nie zmienil (ignoruj ETag)'
        type: boolean
        default: false

# Token potrzebuje prawa zapisu, zeby zacommitowac katalog state/
permissions:
  contents: write

# Dwa przebiegi naraz probowalyby zapisac stan jednoczesnie
concurrency:
  group: monitor-iso
  cancel-in-progress: false

jobs:
  monitor:
    name: Sprawdz nowosci ISO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Sprawdz konfiguracje
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Brak sekretu DISCORD_WEBHOOK_URL - powiadomienia nie beda wysylane."
            echo "Dodaj go w: Settings -> Secrets and variables -> Actions -> New repository secret"
          else
            echo "Sekret DISCORD_WEBHOOK_URL jest ustawiony."
          fi

      - name: Uruchom monitor
        env:
          # --- wymagane ---
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # --- opcjonalne (szczegoly w README) ---
          DISCORD_USERNAME: 'ISO Nowosci'
          MAX_MESSAGES: '250'
          STAGE_WATCH_PREFIXES: '40,50'
          IGNORE_DELETED_PROJECTS: 'true'
          NOTIFY_ALL_STAGE_CHANGES: 'false'
          # FILTER_COMMITTEES: 'ISO/TC 176,ISO/IEC JTC 1/SC 27'
          # FILTER_TYPES: 'IS,TS'
          # FILTER_KEYWORDS: 'security,quality'

          # --- parametry recznego uruchomienia ---
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_BASELINE: ${{ inputs.baseline }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          FLAGS=""
          if [ "$IN_DRY_RUN" = "true" ];  then FLAGS="$FLAGS --dry-run";  fi
          if [ "$IN_BASELINE" = "true" ]; then FLAGS="$FLAGS --baseline"; fi
          if [ "$IN_FORCE" = "true" ];    then FLAGS="$FLAGS --force";    fi

          # Bez webhooka nie ma dokad wysylac. Zamiast konczyc bledem:
          #  - przy pierwszym przebiegu zapisz stan bazowy,
          #  - pozniej pracuj w trybie podgladu (nie zuzywaj stanu, nic nie gin).
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            if [ -f state/iso_snapshot.csv ]; then
              case "$FLAGS" in
                *--dry-run*) ;;
                *) FLAGS="$FLAGS --dry-run"
                   echo "::warning::Brak webhooka - tryb podgladu, stan nie zostanie zmieniony." ;;
              esac
            else
              case "$FLAGS" in
                *--baseline*) ;;
                *) FLAGS="$FLAGS --baseline"
                   echo "::notice::Brak webhooka - zapisuje sam stan bazowy." ;;
              esac
            fi
          fi

          echo "Uruchamiam: python monitor.py $FLAGS"
          python monitor.py $FLAGS

      - name: Zapisz stan w repozytorium
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -d state ]; then
            echo "Brak katalogu state - nie ma czego zapisywac."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- state)" ]; then
            echo "Stan sie nie zmienil - nie ma czego commitowac."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Katalog state/ to dane wyliczane od zera przy kazdym przebiegu, wiec przy
          # rozjezdzie z galezia zdalna nie ma czego scalac - swiezo policzony snapshot
          # jest z definicji nowszy i wygrywa. Wczesniejsza wersja robila tu
          # "git pull --rebase", co na pliku 3 MB konczylo sie konfliktem i zostawialo
          # repozytorium w stanie detached HEAD ("You are not currently on a branch").
          BACKUP="$(mktemp -d)"
          cp -a state/. "$BACKUP/"
          echo "Kopia swiezo policzonego stanu: $BACKUP"

          for attempt in 1 2 3; do
            echo "--- proba $attempt/3 ---"

            # wyjdz z niedokonczonej operacji, jesli poprzednia proba cos zostawila
            git rebase --abort      2>/dev/null || true
            git merge --abort       2>/dev/null || true
            git cherry-pick --abort 2>/dev/null || true

            # ustaw sie twardo na aktualnym czubku galezi zdalnej
            if ! git fetch --force origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
              echo "Nie udalo sie pobrac galezi - ponawiam."
              sleep 5
              continue
            fi
            if ! git checkout --force -B "$BRANCH" "refs/remotes/origin/$BRANCH"; then
              echo "Nie udalo sie przelaczyc na galaz - ponawiam."
              sleep 5
              continue
            fi

            # odtworz swiezo policzony stan na czystej galezi
            rm -rf state
            mkdir -p state
            cp -a "$BACKUP/." state/

            if [ -z "$(git status --porcelain -- state)" ]; then
              echo "Zdalny stan jest juz identyczny - nie ma czego zapisywac."
              exit 0
            fi

            git add -A state
            git commit -q -m "Aktualizacja stanu bazy ISO [skip ci]"

            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "Stan zapisany."
              exit 0
            fi

            echo "Push odrzucony - galaz zmienila sie w trakcie, powtarzam."
            sleep 5
          done

          echo "::error::Nie udalo sie zapisac stanu do repozytorium po 3 probach."
          exit 1
