name: Monitor ISO

on:
  schedule:
    # Monitor co 4 godziny. Godziny 19 i 20 UTC sa wolne - naleza do raportu.
    - cron: '0 1,5,9,13,17,21 * * *'

    # Raport dzienny o 21:00 czasu warszawskiego. Cron w GitHub Actions zna
    # tylko UTC i nie uwzglednia zmiany czasu, wiec sa dwa wpisy:
    - cron: '0 19 * * *'    # 21:00 w Warszawie w czasie letnim (CEST)
    - cron: '0 20 * * *'    # 21:00 w Warszawie w czasie zimowym (CET)
    # Zadanie raportu sprawdza realna godzine w Warszawie i wychodzi, jesli
    # akurat nie jest 21 - dzieki temu wysylka jest dokladnie raz dziennie.

  # Reczne uruchomienie z zakladki Actions
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tryb testowy - nie wysylaj nic na Discord'
        type: boolean
        default: false
      baseline:
        description: 'Zapisz stan bazowy od nowa (bez powiadomien)'
        type: boolean
        default: false
      force:
        description: 'Pobierz CSV nawet jesli sie nie zmienil (ignoruj ETag)'
        type: boolean
        default: false
      raport:
        description: 'Wyslij raport dzienny zamiast sprawdzania (o dowolnej porze)'
        type: boolean
        default: false

# Token potrzebuje prawa zapisu, zeby zacommitowac katalog state/
permissions:
  contents: write

# Dwa przebiegi naraz probowalyby zapisac stan jednoczesnie
concurrency:
  group: monitor-iso
  cancel-in-progress: false

jobs:
  monitor:
    name: Sprawdz nowosci ISO
    # Nie uruchamiaj sie o porach zarezerwowanych dla raportu ani gdy raport
    # zostal wywolany recznie.
    if: >-
      github.event.schedule != '0 19 * * *' &&
      github.event.schedule != '0 20 * * *' &&
      !inputs.raport
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Zainstaluj zaleznosci
        run: pip install -r requirements.txt

      - name: Sprawdz konfiguracje
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Brak sekretu DISCORD_WEBHOOK_URL - powiadomienia nie beda wysylane."
            echo "Dodaj go w: Settings -> Secrets and variables -> Actions -> New repository secret"
          else
            echo "Sekret DISCORD_WEBHOOK_URL jest ustawiony."
          fi

      - name: Uruchom monitor
        env:
          # --- wymagane ---
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # --- opcjonalne (szczegoly w README) ---
          DISCORD_USERNAME: 'ISO Nowosci'
          MAX_MESSAGES: '250'
          STAGE_WATCH_PREFIXES: '40,50'
          IGNORE_DELETED_PROJECTS: 'true'
          NOTIFY_ALL_STAGE_CHANGES: 'false'
          # FILTER_COMMITTEES: 'ISO/TC 176,ISO/IEC JTC 1/SC 27'
          # FILTER_TYPES: 'IS,TS'
          # FILTER_KEYWORDS: 'security,quality'

          # --- parametry recznego uruchomienia ---
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_BASELINE: ${{ inputs.baseline }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          FLAGS=""
          if [ "$IN_DRY_RUN" = "true" ];  then FLAGS="$FLAGS --dry-run";  fi
          if [ "$IN_BASELINE" = "true" ]; then FLAGS="$FLAGS --baseline"; fi
          if [ "$IN_FORCE" = "true" ];    then FLAGS="$FLAGS --force";    fi

          # Bez webhooka nie ma dokad wysylac. Zamiast konczyc bledem:
          #  - przy pierwszym przebiegu zapisz stan bazowy,
          #  - pozniej pracuj w trybie podgladu (nie zuzywaj stanu, nic nie gin).
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            if [ -f state/iso_snapshot.csv ]; then
              # --baseline wybrany recznie ma pierwszenstwo: uzytkownik swiadomie chce
              # przebudowac stan, wiec nie degradujemy tego do trybu podgladu.
              case "$FLAGS" in
                *--dry-run*|*--baseline*) ;;
                *) FLAGS="$FLAGS --dry-run"
                   echo "::warning::Brak webhooka - tryb podgladu, stan nie zostanie zmieniony." ;;
              esac
            else
              case "$FLAGS" in
                *--baseline*) ;;
                *) FLAGS="$FLAGS --baseline"
                   echo "::notice::Brak webhooka - zapisuje sam stan bazowy." ;;
              esac
            fi
          fi

          echo "Uruchamiam: python monitor.py $FLAGS"
          python monitor.py $FLAGS

      - name: Zapisz stan w repozytorium
        if: always()
        run: |
          if [ ! -d state ]; then
            echo "Brak katalogu state - nie ma czego zapisywac."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- state)" ]; then
            echo "Stan sie nie zmienil - nie ma czego commitowac."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "Aktualizacja stanu bazy ISO [skip ci]"

          # Katalog state/ jest liczony od zera przy kazdym przebiegu, wiec nie ma tu
          # czego scalac - swiezy snapshot z definicji zastepuje poprzedni. Dlatego
          # zamiast rebase (ktory na pliku 3 MB konczyl sie konfliktem i zostawial
          # repozytorium w stanie detached HEAD) robimy zwykly force push.
          # Jawne HEAD:main omija blad "You are not currently on a branch".
          git push origin HEAD:main --force
          echo "Stan zapisany."

  # ------------------------------------------------------------------------
  # Codzienne sprawozdanie na Discord - zwykla wiadomosc tekstowa (bez embedow),
  # zeby zmiescic sie w limicie 2000 znakow konta bez Nitro.
  # ------------------------------------------------------------------------
  raport:
    name: Raport dzienny
    if: >-
      github.event.schedule == '0 19 * * *' ||
      github.event.schedule == '0 20 * * *' ||
      inputs.raport
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Sprawdz pore w Warszawie
        id: pora
        env:
          RECZNIE: ${{ inputs.raport }}
        run: |
          GODZINA="$(TZ=Europe/Warsaw date +%H)"
          echo "W Warszawie jest teraz godzina $GODZINA."
          if [ "$RECZNIE" = "true" ]; then
            echo "Uruchomienie reczne - wysylam niezaleznie od pory."
            echo "wysylac=true" >> "$GITHUB_OUTPUT"
          elif [ "$GODZINA" = "21" ]; then
            echo "Pora na raport dzienny."
            echo "wysylac=true" >> "$GITHUB_OUTPUT"
          else
            echo "wysylac=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nie jest 21:00 w Warszawie - ten cron obsluguje druga polowe roku, raport pominiety."
          fi

      - name: Pobierz repozytorium
        if: steps.pora.outputs.wysylac == 'true'
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        if: steps.pora.outputs.wysylac == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Zainstaluj zaleznosci
        if: steps.pora.outputs.wysylac == 'true'
        run: pip install -r requirements.txt

      - name: Wyslij raport na Discord
        if: steps.pora.outputs.wysylac == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: 'ISO Nowosci'
          # Raport respektuje te same filtry co monitor
          # FILTER_COMMITTEES: 'ISO/TC 176,ISO/IEC JTC 1/SC 27'
          # FILTER_TYPES: 'IS,TS'
          # FILTER_KEYWORDS: 'security,quality'
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Brak sekretu DISCORD_WEBHOOK_URL - raport tylko w logu przebiegu."
            python raport.py --dry-run
          else
            python raport.py
          fi

      - name: Zapisz punkt odniesienia raportu
        if: always() && steps.pora.outputs.wysylac == 'true'
        run: |
          if [ -z "$(git status --porcelain -- state)" ]; then
            echo "Punkt odniesienia bez zmian - nie ma czego commitowac."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "Punkt odniesienia raportu dziennego [skip ci]"
          git push origin HEAD:main --force
          echo "Punkt odniesienia zapisany."
